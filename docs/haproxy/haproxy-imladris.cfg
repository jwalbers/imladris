# HAProxy configuration — Oregon pfSense
# Baseline: ha.bipeds.org (Home Assistant)
# Added:    imladrislab.org (Imladris Lab — 7 subdomains)
#
# Updated:      2026-06-16 — replace htpasswd with SimpleSAMLphp Entra SAML auth
# Updated:      2026-07-07 — all services on BESSIE (192.168.1.10); add tools.imladrislab.org;
#                            fix CORS preflight for orthanc-p (http-after-response)
#
# NOTE: This file is a reference draft. pfSense auto-generates
# /var/etc/haproxy/haproxy.cfg from its GUI — use this as the
# configuration target when entering settings in the pfSense HAProxy UI.
#
# Network topology:
#   pfSense LAN:  192.168.1.0/24
#   BESSIE:       192.168.1.10  (Windows — hosts all Imladris Docker services)
#   Mac (dev):    192.168.1.11  (wired via USB-C dock — local dev only, not in HAProxy)
#
# BEFORE APPLYING:
#   1. Install pfSense ACME package and obtain wildcard cert for
#      imladrislab.org + *.imladrislab.org (DNS-01 challenge)
#   2. Add the new cert to /var/etc/haproxy/HA_Frontend.crt_list
#   3. Add SAML_SP_SECRETSALT and SAML_ADMIN_PASSWORD to .env (see docs/entra-auth.md)

global
    maxconn                 1000
    stats socket /tmp/haproxy.socket level admin  expose-fd listeners
    uid                     80
    gid                     80
    nbthread                1
    hard-stop-after         15m
    chroot                  /tmp/haproxy_chroot
    daemon
    server-state-file /tmp/haproxy_server_state

# ─────────────────────────────────────────────────────────────────────────────
# NOTE: htpasswd userlist removed — auth is now handled by SimpleSAMLphp SP
# (Entra SAML 2.0).  See docs/entra-auth.md.
# ─────────────────────────────────────────────────────────────────────────────

listen HAProxyLocalStats
    bind 127.0.0.1:2200 name localstats
    mode http
    stats enable
    stats admin if TRUE
    stats show-legends
    stats uri /haproxy/haproxy_stats.php?haproxystats=1
    timeout client  5000
    timeout connect 5000
    timeout server  5000

# ── Single shared frontend ────────────────────────────────────────────────────
# HA_Frontend.crt_list must contain entries for:
#   ha.bipeds.org           (existing)
#   imladrislab.org         (new — wildcard *.imladrislab.org covers all subdomains)

frontend HA_Frontend
    bind            68.116.51.146:443 name 68.116.51.146:443 \
                        ssl crt-list /var/etc/haproxy/HA_Frontend.crt_list
    mode            http
    log             global
    option          http-keep-alive
    timeout client  50000

    http-request set-var(txn.txnhost) hdr(host)

    # ── Existing: ha.bipeds.org (Home Assistant) ──────────────────────────
    acl  is_ha              var(txn.txnhost) -m str -i ha.bipeds.org
    acl  aclcrt_HA_Frontend var(txn.txnhost) -m reg -i ^ha\.bipeds\.org(:([0-9]){1,5})?$

    # ── New: imladrislab.org ───────────────────────────────────────────────
    # Cert ACL — matches root domain and all subdomains
    acl  aclcrt_imladris    var(txn.txnhost) -m reg -i \
                                ^(imladrislab\.org|.*\.imladrislab\.org)(:([0-9]){1,5})?$

    # Per-subdomain host ACLs
    acl  is_imladris_landing    var(txn.txnhost) -m str -i imladrislab.org
    acl  is_imladris_openmrs    var(txn.txnhost) -m str -i openmrs.imladrislab.org
    acl  is_imladris_orthanc_m  var(txn.txnhost) -m str -i orthanc-m.imladrislab.org
    acl  is_imladris_orthanc_p  var(txn.txnhost) -m str -i orthanc-p.imladrislab.org
    acl  is_imladris_ohif       var(txn.txnhost) -m str -i ohif.imladrislab.org
    acl  is_imladris_console    var(txn.txnhost) -m str -i console.imladrislab.org
    acl  is_imladris_tools      var(txn.txnhost) -m str -i tools.imladrislab.org

    # Auth: SimpleSAMLphp SP (imladrislab.org backend) enforces Entra SAML
    # auth at the application layer — no HAProxy-level auth rule needed here.
    # htpasswd block removed 2026-06-16.

    # ── Routing ───────────────────────────────────────────────────────────
    use_backend HA_Server_ipvANY        if  is_ha              aclcrt_HA_Frontend
    use_backend Imladris_Landing        if  is_imladris_landing    aclcrt_imladris
    use_backend Imladris_OpenMRS        if  is_imladris_openmrs    aclcrt_imladris
    use_backend Imladris_OrtMod         if  is_imladris_orthanc_m  aclcrt_imladris
    use_backend Imladris_OrtPACS        if  is_imladris_orthanc_p  aclcrt_imladris
    use_backend Imladris_OHIF           if  is_imladris_ohif       aclcrt_imladris
    use_backend Imladris_Console        if  is_imladris_console    aclcrt_imladris
    use_backend Imladris_Tools          if  is_imladris_tools      aclcrt_imladris

# ── Existing backend ──────────────────────────────────────────────────────────

backend HA_Server_ipvANY
    mode            http
    id              100
    log             global
    option          log-health-checks
    timeout connect 5s
    timeout server  50s
    timeout tunnel  1h
    retries         3
    load-server-state-from-file global
    server          ha 192.168.1.80:8123 id 101

# ── Imladris Lab backends — all services on BESSIE (192.168.1.10) ─────────────

backend Imladris_Landing
    mode            http
    id              200
    log             global
    timeout connect 5s
    timeout server  30s
    option          forwardfor
    http-request    set-header X-Forwarded-Proto https  # required for SimpleSAMLphp cookie SameSite=None
    server          saml_sp 192.168.1.10:8091 id 201   # SimpleSAMLphp SP

backend Imladris_OpenMRS
    mode            http
    id              210
    log             global
    timeout connect 10s
    timeout server  120s        # OpenMRS can be slow on first page load
    option          forwardfor
    http-request    set-header X-Forwarded-Proto https
    server          openmrs 192.168.1.10:8080 id 211

backend Imladris_OrtMod
    mode            http
    id              220
    log             global
    timeout connect 5s
    timeout server  60s
    timeout tunnel  1h          # DICOM transfers can run long
    option          forwardfor
    http-request    set-header X-Forwarded-Proto https
    server          orthanc_modality 192.168.1.10:8042 id 221

backend Imladris_OrtPACS
    mode            http
    id              230
    log             global
    timeout connect 5s
    timeout server  300s        # STOW-RS uploads (cine files) can be slow
    timeout tunnel  1h
    option          forwardfor
    http-request    set-header X-Forwarded-Proto https
    # CORS headers for regular (non-preflight) responses from the backend.
    http-response   set-header Access-Control-Allow-Origin "*"
    http-response   set-header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
    http-response   set-header Access-Control-Allow-Headers "Authorization, Content-Type, Accept"
    http-response   set-header Access-Control-Expose-Headers "Content-Length, Content-Range"
    # OPTIONS preflight: HAProxy does not forward OPTIONS to the backend (known pfSense quirk).
    # Intercept here and return 204 with CORS headers inline via hdr keywords.
    # http-response set-header does NOT apply to synthetic responses; hdr on http-request return does.
    http-request    return status 204 hdr Access-Control-Allow-Origin "*" hdr Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" hdr Access-Control-Allow-Headers "Authorization, Content-Type, Accept" hdr Access-Control-Expose-Headers "Content-Length, Content-Range" if { method OPTIONS }
    server          orthanc_pacs 192.168.1.10:8044 id 231   # pacs-proxy (nginx CORS proxy → orthanc-pacs:8042)

backend Imladris_OHIF
    mode            http
    id              240
    log             global
    timeout connect 5s
    timeout server  60s
    timeout tunnel  1h
    option          forwardfor
    http-request    set-header X-Forwarded-Proto https
    server          ohif 192.168.1.10:3000 id 241

backend Imladris_Console
    mode            http
    id              250
    log             global
    timeout connect 5s
    timeout server  60s
    option          forwardfor
    http-request    set-header X-Forwarded-Proto https
    server          console 192.168.1.10:5001 id 251

backend Imladris_Tools
    mode            http
    id              260
    log             global
    timeout connect 5s
    timeout server  60s
    option          forwardfor
    http-request    set-header X-Forwarded-Proto https
    server          tools 192.168.1.10:5002 id 261
