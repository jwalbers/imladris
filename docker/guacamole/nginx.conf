# SSO gate in front of Guacamole. Every request is checked against the lab's
# SimpleSAMLphp session (the landing site's Entra sign-in, cookie on
# .imladrislab.org/.net). Signed in: Guacamole gets the email in X-Remote-User
# (its header-auth extension). Not signed in: off to sso-login.php and back.
# Guacamole itself is reachable only through here (and localhost:8096 on the host).

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# imladrislab.org or .net, whichever this request came in on
map $host $lab_apex {
    ~^(?:[^.]+\.)?(?<apex>imladrislab\.(?:org|net))$  $apex;
    default                                           imladrislab.org;
}

server {
    listen 80;

    location = /_sso_check {
        internal;
        proxy_pass http://host.docker.internal:8091/auth-check.php;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $lab_apex;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
    }

    location @sso_login {
        return 302 https://$lab_apex/sso-login.php?return=https%3A%2F%2F$host%2F;
    }

    location / {
        auth_request /_sso_check;
        auth_request_set $sso_user $upstream_http_x_auth_user;
        error_page 401 = @sso_login;

        proxy_pass http://guacamole:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Remote-User $sso_user;   # always overwritten: a client can't supply it
    }
}
