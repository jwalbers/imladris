# SimpleSAMLphp Apache configuration — IMLADRIS SP
#
# Serves:
#   /simplesaml/   → SimpleSAMLphp SAML engine (ACS, metadata, login, logout)
#   /              → DocumentRoot /var/www/html/ (our auth-gated portal index.php)

# Trust X-Forwarded-Proto from HAProxy so SimpleSAMLphp knows it's behind HTTPS.
# Without this, session cookies won't be marked Secure and SAML redirects
# will use http:// instead of https://.
SetEnvIf X-Forwarded-Proto "https" HTTPS=on

# Alias /simplesaml to SimpleSAMLphp's public directory.
# FallbackResource routes unknown paths through SimpleSAMLphp's front controller.
Alias /simplesaml /var/simplesamlphp/public

<Directory /var/simplesamlphp/public>
    Require all granted
    AllowOverride None
    Options None
    FallbackResource /simplesaml/index.php
</Directory>
