# Imladris — Virtual Integration Lab
#
# Default (no profile): landing page + modality simulator + cloud PACS.
# Add --profile full to also start the modality sidecar (requires OpenMRS MWL).
#
# Quick start:
#   docker compose up -d
#   open http://localhost:8090   # landing page (no auth — local dev only)
#   open http://localhost:8091   # landing page via simplesamlphp SP (Entra SAML auth)
#   open http://localhost:8042   # modality (AE: IML_CR_01 / IML_US_01)
#   open http://localhost:8043   # cloud PACS (AE: IML_PACS_01)
#   open http://localhost:8044   # PACS DICOMweb CORS proxy (used by OHIF)
#   open http://localhost:3000   # OHIF viewer
#
# Upload a study to the modality:
#   curl -u admin:admin -X POST http://localhost:8042/instances \
#        --data-binary @some_file.dcm
#
# Push it to the PACS:
#   curl -u admin:admin -X POST http://localhost:8042/modalities/IML_PACS_01/store \
#        -d '["<study-uid>"]'
name: ${SERVICE_NAME:-imladris}

services:
  # ── Landing page (no auth — local dev / localhost only) ─────────────
  landing:
    image: nginx:alpine
    container_name: imladris-landing
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./landing/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - imladris

  # ── SimpleSAMLphp SP — Entra SAML 2.0 auth gate for imladrislab.org ──
  #
  # HAProxy routes imladrislab.org here (port 8091, was 8090/landing).
  # /simplesaml/ — SimpleSAMLphp SAML endpoints (ACS, metadata, login)
  # /            — index.php: requires SAML auth, then serves landing.html
  # /user-info.php — JSON endpoint for auth bar (called by landing.html JS)
  #
  # pfSense change: update Imladris_Landing backend server port 8090 → 8091
  #                 remove htpasswd http-request auth block from frontend
  #                 remove userlist imladris_users from global settings
  #
  simplesamlphp:
    build:
      context: .                    # parent dir so Dockerfile can COPY landing/index.html
      dockerfile: simplesamlphp/Dockerfile
    image: imladris-saml-sp:local   # local tag so docker compose doesn't try to pull
    container_name: imladris-saml-sp
    restart: unless-stopped
    ports:
      - "8091:80"
    volumes:
      # SimpleSAMLphp config and metadata
      - ./simplesamlphp/config/config.php:/var/simplesamlphp/config/config.php:ro
      - ./simplesamlphp/config/authsources.php:/var/simplesamlphp/config/authsources.php:ro
      - ./simplesamlphp/metadata/saml20-idp-remote.php:/var/simplesamlphp/metadata/saml20-idp-remote.php:ro
      # SP signing keypair (optional for lab — see docs/entra-auth.md to generate)
      - ./simplesamlphp/cert:/var/simplesamlphp/cert:ro
      # Portal app (auth-gated; served from Apache DocumentRoot /var/www/html/)
      - ./simplesamlphp/www/index.php:/var/www/html/index.php:ro
      - ./simplesamlphp/www/user-info.php:/var/www/html/user-info.php:ro
      - ./simplesamlphp/www/logout.php:/var/www/html/logout.php:ro
      - ./simplesamlphp/www/auth-check.php:/var/www/html/auth-check.php:ro   # SSO check for other lab sites
      - ./simplesamlphp/www/sso-login.php:/var/www/html/sso-login.php:ro     # sign in, then return to a lab site
      # landing/index.html is baked into the image (see Dockerfile COPY).
      # To update: edit landing/index.html then: docker compose up -d --build simplesamlphp
    environment:
      SAML_SP_SECRETSALT:   ${SAML_SP_SECRETSALT}
      SAML_ADMIN_PASSWORD:  ${SAML_ADMIN_PASSWORD}
    networks:
      - imladris

  # -- MySQL -----------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: imladris-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpw}
      MYSQL_DATABASE: openmrs
      MYSQL_USER: openmrs
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-openmrs}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/openmrs.cnf:/etc/mysql/conf.d/openmrs.cnf:ro
    networks:
      - imladris

  # ── Qure.ai gateway simulator ───────────────────────────────────────
  # Listens as DICOM SCP AE "QUREAI" on port 5252.
  # Sidecar sends CR/DX primary images here after sending to AdvaPACS.
  # qure-sim returns a Secondary Capture to the sidecar SCP (scp_relay)
  # which immediately forwards it to the AdvaPACS gateway.
  #
  # Requires the annotated PNG sample library to be available at SAMPLE_DIR.
  # Mount the external drive or adjust the volume path as needed.
  qure-sim:
    build: ./qure-sim
    container_name: imladris-qure-sim
    restart: unless-stopped
    ports:
      - "5252:5252"   # DICOM SCP (QUREAI AE)
    volumes:
      - ${SAMPLE_DIR_HOST}:/sample_outputs:ro
    environment:
      TZ: ${LAB_TZ:-America/Los_Angeles}   # DICOM/worklist times are lab-local, with offset
      SCP_AE:       QUREAI
      SCP_PORT:     "5252"
      ORTHANC_HOST: imladris-sidecar   # scp_relay SCP on the sidecar
      ORTHANC_PORT: "4242"
      ORTHANC_AE:   ${LAB_CR_AET:-IML_CR_01}
      SAMPLE_DIR:   /sample_outputs
      DELAY_SEC:    "3"
    networks:
      - imladris

  # ── AdvaPACS Gateway ────────────────────────────────────────────────
  # Receives DICOM C-STORE from modalities and forwards to AdvaPACS cloud.
  # Parallel path to orthanc-pacs for comparison / integration testing.
  #
  # IMPORTANT — network_mode: host
  #   Works correctly on Linux (production / Windows WSL2 backend).
  #   On macOS Docker Desktop, host networking is not supported — the
  #   container starts but ports won't bind as expected. Use the server
  #   for real gateway testing; local Mac is for config validation only.
  #
  # Ports (bound directly to host via host networking):
  #   11112  DICOM C-STORE SCP  — register as AE "ADVAPACS_GW" in Orthanc
  #   8085   DICOMweb proxy     — STOW-RS / WADO-RS / QIDO-RS
  advapacs-gateway:
    image: advahealthsolutions/advapacs-gateway:latest
    container_name: imladris-advapacs-gw
    restart: unless-stopped
    environment:
      ADVAPACS_ACCESS_KEY_ID:     ${ADVAPACS_GW_KEY_ID}
      ADVAPACS_ACCESS_KEY_SECRET: ${ADVAPACS_GW_SECRET}
      ADVAPACS_REGION:            "usa1"
      TZ:                         ${LAB_TZ:-America/Los_Angeles}
      LOGGING_LEVEL_ORG_DCM4CHE3:              DEBUG
      LOGGING_LEVEL_COM_ADVAHEALTHSOLUTIONS:   DEBUG
    network_mode: "host"
    # NOTE: no 'networks' key — host mode is incompatible with bridge networks.
    # On Linux the gateway is reachable at the host IP on its native ports.
    volumes:
      - advapacs-gw-data:/opt/AdvaHealthSolutions/AdvaPACSGateway

  # ── Cloud PACS ──────────────────────────────────────────────────────
  orthanc-pacs:
    image: orthancteam/orthanc:latest
    container_name: imladris-pacs
    restart: unless-stopped
    ports:
      - "4243:4242"   # DICOM C-STORE
      - "8043:8042"   # REST API + web UI
    volumes:
      - ./orthanc/pacs.json:/etc/orthanc/orthanc.json:ro
      # forward-to-advapacs.lua intentionally NOT mounted: Orthanc never sends to AdvaPACS.
      - ./orthanc/lab-guard.lua:/etc/orthanc/lab-guard.lua:ro
      - ./orthanc/forward-to-qure.lua:/etc/orthanc/forward-to-qure.lua:ro
      - pacs-data:/var/lib/orthanc/db
    # No AdvaPACS credentials: Orthanc has no path to AdvaPACS.
    # pacs.json reads ${ADVAPACS_GW_AE} (Orthanc expands env vars in its config);
    # the host-networked gateway is reached via host.docker.internal.
    environment:
      ADVAPACS_GW_AE: ${ADVAPACS_GW_AE:-ADVAPACS_GW_01}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - imladris

  # ── nginx CORS proxy for AdvaPACS cloud DICOMweb (required by OHIF) ─
  # Adds Basic Auth (ADVAPACS_KEY_ID:ADVAPACS_SECRET, pre-encoded as
  # ADVAPACS_AUTH_B64) and CORS headers so the browser can read responses.
  # HAProxy: add backend advapacs-p.imladrislab.org → BESSIE:8087
  advapacs-proxy:
    image: nginx:alpine
    container_name: imladris-advapacs-proxy
    restart: unless-stopped
    ports:
      - "8087:8087"
    volumes:
      - ./nginx/advapacs-proxy.conf.template:/etc/nginx/templates/advapacs-proxy.conf.template:ro
    environment:
      ADVAPACS_AUTH_B64: ${ADVAPACS_AUTH_B64}
    networks:
      - imladris

  # ── nginx CORS proxy for PACS (required by OHIF) ───────────────────
  pacs-proxy:
    image: nginx:alpine
    container_name: imladris-pacs-proxy
    restart: unless-stopped
    ports:
      - "8044:8044"   # PACS DICOMweb endpoint with CORS headers
    volumes:
      - ./nginx/pacs-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - orthanc-pacs
    networks:
      - imladris

  # ── Lab Tool Cabinet ────────────────────────────────────────────────
  # Network connectivity simulator + future lab tooling.
  # Runs with network_mode: host so it shares the WSL2 root netns with
  # advapacs-gateway and can apply iptables rules that affect it.
  #
  # HAProxy: add backend for tools.imladrislab.org → localhost:5002
  tool-cabinet:
    build: ./tool-cabinet
    image: imladris-tool-cabinet:local
    container_name: imladris-tool-cabinet
    restart: unless-stopped
    network_mode: "host"   # shares WSL2 netns; no 'networks:' key
    cap_add:
      - NET_ADMIN           # required for iptables
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      TZ: ${LAB_TZ:-America/Los_Angeles}   # DICOM/worklist times are lab-local, with offset
      PORT: "5002"
      PACS_URL: http://localhost:8043
      PACS_USER: admin
      PACS_PASSWORD: admin
      GATEWAY_CONTAINER: imladris-advapacs-gw
      ADVAPACS_HOSTS: "usa1.api.dicomweb.advapacs.com"
      FHIR_KEY_ID: ${ADVAPACS_KEY_ID:-}
      FHIR_KEY_SECRET: ${ADVAPACS_SECRET:-}
      DICOM_TOOLS_AE: ${LAB_TOOLS_AET:-IML_TOOLS_01}
      DICOM_GW_HOST: localhost
      DICOM_GW_PORT: "11112"
      DICOM_GW_AE: ${ADVAPACS_GW_AE:-ADVAPACS_GW_01}
      DICOM_CALLING_AE: ${LAB_CR_AET:-IML_CR_01}
      CR_AET: ${LAB_CR_AET:-IML_CR_01}
      US_AET: ${LAB_US_AET:-IML_US_01}
      CT_AET: ${LAB_CT_AET:-IML_CT_01}

  # ── OHIF Viewer (radiologist workstation) ──────────────────────────
  ohif:
    image: ohif/app:v3.10.0
    container_name: imladris-ohif
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./ohif/app-config.js:/usr/share/nginx/html/app-config.js:ro
      - ./ohif/app-config.js.gz:/usr/share/nginx/html/app-config.js.gz:ro
    depends_on:
      - pacs-proxy
    networks:
      - imladris

  # ── Modality sidecar (HL7 bridge + MWL poller + DICOM SCP relay) ────
  # Requires OpenMRS (on host) and AdvaPACS gateway (host-networked).
  modality-sidecar:
    build: ../../sidecar
    container_name: imladris-sidecar
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux (GCE/WSL2) — resolves to VM host IP
    depends_on:
      - orthanc-pacs
    ports:
      - "2575:2575"   # MLLP HL7 listener (OpenMRS sends orders here)
      - "4242:4242"   # DICOM C-STORE SCP relay (scp_relay; qure-sim sends SC here)
      - "5001:5001"   # Modality console web UI
    volumes:
      - worklist-data:/worklist
      - sidecar-data:/data        # order poller state (last-polled timestamp)
      - ../../../imladris-bophelong/patients/dicom:/hospital-records:ro
    environment:
      TZ: ${LAB_TZ:-America/Los_Angeles}   # DICOM/worklist times are lab-local, with offset
      # Modality AE titles — per site (Oregon _01, Wisconsin _02); set in .env
      MODALITY_AET: ${LAB_CR_AET:-IML_CR_01}
      CR_AET: ${LAB_CR_AET:-IML_CR_01}
      US_AET: ${LAB_US_AET:-IML_US_01}
      CT_AET: ${LAB_CT_AET:-IML_CT_01}
      INSTITUTION: Bophelong MDR-TB Hospital
      DICOM_ISSUER_OF_PATIENT_ID: PIH_A
      # Patients are imaged by hand from the modality console. AUTO_ACQUIRE=true
      # makes the sidecar image every worklist entry itself (unattended runs only;
      # it races the console's Image Patient button).
      AUTO_ACQUIRE: ${AUTO_ACQUIRE:-false}
      # Experiment (2026-10-21, off: made no difference): mark the AdvaPACS order completed before sending the
      # images, to test whether matched studies then reach the Unread board. Revert
      # (false) once AdvaHealth confirms how ordered studies get to Ready to Read.
      COMPLETE_ORDER_BEFORE_SEND: ${COMPLETE_ORDER_BEFORE_SEND:-false}
      POLL_INTERVAL_MINUTES: 0.25   # auto mode only: 15 sec
      WL_FOLDER: /worklist
      HOSPITAL_RECORDS: /hospital-records
      # AdvaPACS gateway (host-networked on 11112)
      ADVAPACS_GW_HOST: host.docker.internal
      ADVAPACS_GW_PORT: "11112"
      ADVAPACS_GW_AE: ${ADVAPACS_GW_AE:-ADVAPACS_GW_01}
      # Qure.ai simulator
      QURE_HOST: imladris-qure-sim
      QURE_PORT: "5252"
      QURE_AE: QUREAI
      ENABLE_QURE: "true"
      # scp_relay SCP (receives SC from qure-sim, forwards to AdvaPACS)
      SCP_AE: ${LAB_CR_AET:-IML_CR_01}
      SCP_PORT: "4242"
      # Order poller (OpenMRS REST → AdvaPACS ORM^O01)
      OPENMRS_URL: http://host.docker.internal:8080/openmrs
      OPENMRS_USER: ${OPENMRS_SERVICE_USER:-imladris-service}
      OPENMRS_PASSWORD: ${OPENMRS_SERVICE_PASSWORD}
      ORDER_POLL_SEC: 10            # 10 sec — demo mode (restore to 30 for production)
      ORDER_STATE_FILE: /data/order_poller_state.json
      # RADIOLOGY_ORDER_TYPE_UUID: ""   # leave blank to auto-discover
      # PACS change watcher (ORU^R01 back to OpenMRS)
      OPENMRS_HL7_HOST: host.docker.internal
      OPENMRS_HL7_PORT: 8066
      PACS_URL: http://orthanc-pacs:8042
      PACS_USER: admin
      PACS_PASSWORD: admin
      CHANGE_POLL_SEC: 15
      # FHIR MWL synthesizer (AdvaPACS ServiceRequest → .wl files)
      FHIR_KEY_ID: ${ADVAPACS_KEY_ID:-}
      FHIR_KEY_SECRET: ${ADVAPACS_SECRET:-}
      FHIR_POLL_SEC: 30
      # AdvaPACS webhook receiver (POST /webhook/advapacs)
      WEBHOOK_SECRET: ${ADVAPACS_WEBHOOK_SECRET:-}
      # Every webhook is also passed on to the report console as a trigger
      REPORT_CONSOLE_URL: http://imladris-report-console:5003/trigger
    networks:
      - imladris
    profiles:
      - full   # only starts with: docker compose --profile full up

  # ── Report console (reporting side of the workflow, from AdvaPACS FHIR) ──
  # Orders, studies and reports per accession, with a timeline of changes.
  # Fed by webhooks forwarded from the sidecar (triggers only) plus a catch-up
  # sync every SYNC_SEC. Users reach it only through report-sso-gate (PIH
  # sign-in); 5003 is published on localhost for the lab health check.
  report-console:
    build: ../../report-console
    container_name: imladris-report-console
    restart: unless-stopped
    ports:
      - "127.0.0.1:5003:5003"
    volumes:
      - report-data:/data
    environment:
      FHIR_KEY_ID: ${ADVAPACS_KEY_ID:-}
      FHIR_KEY_SECRET: ${ADVAPACS_SECRET:-}
      SYNC_SEC: "120"
      CR_AET: ${LAB_CR_AET:-IML_CR_01}
      US_AET: ${LAB_US_AET:-IML_US_01}
      CT_AET: ${LAB_CT_AET:-IML_CT_01}
      LAB_SITE_NAME: ${LAB_SITE_NAME:-this site}
      TZ: ${LAB_TZ:-America/Los_Angeles}
    networks:
      - imladris
    profiles:
      - full

  # PIH sign-in in front of the report console.
  # HAProxy: reports.imladrislab.org → <lab host>:5004.
  report-sso-gate:
    image: nginx:1.27-alpine
    container_name: imladris-report-sso-gate
    restart: unless-stopped
    depends_on: [report-console, simplesamlphp]
    ports:
      - "5004:80"
    environment:
      SSO_UPSTREAM: imladris-report-console:5003
    volumes:
      - ./sso-gate/sso-gate.conf.template:/etc/nginx/templates/default.conf.template:ro,z
    networks:
      - imladris
    profiles:
      - full

volumes:
  mysql-data:
  pacs-data:
  worklist-data:    # DICOM .wl files written by fhir_mwl_poller, read by sidecar
  advapacs-gw-data: # Gateway registration state + Derby DB — persists across --force-recreate
  sidecar-data:     # order poller persistent state
  report-data:      # report console database (rebuilt from AdvaPACS if lost)

networks:
  imladris:
    driver: bridge
