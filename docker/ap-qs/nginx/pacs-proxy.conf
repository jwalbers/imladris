server {
    listen 8044;

    location / {
        # Preflight: return 204, CORS headers applied by add_header always below.
        # No add_header inside this if block — when if has its own add_header it
        # replaces the parent's, making the always directives ineffective for OPTIONS.
        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://orthanc-pacs:8042;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # always = add to ALL responses including the 204 from the if block above
        add_header 'Cache-Control' 'no-store' always;
        add_header 'Access-Control-Allow-Origin'  '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;
    }
}
