# Serve local app-config.js (localhost:8044) instead of the op-qs default
# (orthanc-p.imladrislab.org). Exact-match location takes priority over the
# default try_files static handler. gzip_static off prevents nginx from
# looking for a .gz companion and serving the stale external-hostname version.
location = /app-config.js {
    gzip_static  off;
    default_type application/javascript;
    alias        /usr/share/nginx/html/app-config-local.js;
    add_header   Cache-Control "no-cache, must-revalidate";
}
